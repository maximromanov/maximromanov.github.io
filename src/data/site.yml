name: Maxim Romanov
name_ar: "مكسيم رومانوف"
url: https://maximromanov.github.io
description: "Maxim Romanov: historian of the premodern Islamic world and the Arabic written tradition; digital humanities; EIS1600, OpenITI, al-Ṯurayyā, mARkdown."
old_name: al-Raqmiyyāt
old_name_ar: الرقميّات

# Main navigation, in order. `num` is the Arabic-Indic numeral shown before the label.
nav:
  - {label: Research, url: /research/, num: "١"}
  - {label: Publications, url: /publications/, num: "٢"}
  - {label: Talks, url: /talks/, num: "٣"}
  - {label: Teaching, url: /teaching/, num: "٤"}
  - {label: Notes, url: /notes/, num: "٥"}
  - {label: CV, url: /cv/, num: "٦"}

# Contact and profile links (home page and footer). An `email` entry is scrambled in the HTML and
# decoded in the browser by assets/theme.js, so the address never appears in the page source.
links:
  - {label: Email, email: "maxim.romanov@uni-hamburg.de"}
  - {label: GitHub, url: "https://github.com/maximromanov"}
  - {label: EIS1600, url: "https://eis1600.aai.uni-hamburg.de/"}
  - {label: ORCID, url: "https://orcid.org/0000-0001-7331-3858"}
  - {label: Academia.edu, url: "https://univie.academia.edu/MaximRomanov"}

# Affiliated projects shown in the header rail on the home page.
projects_rail:
  - {abbr: EIS1600, label: "The Evolution of Islamic Societies", url: "/research/#eis1600"}
  - {abbr: OpenITI, label: "Open Islamicate Texts Initiative", url: "/research/#openiti"}
  - {abbr: "al-Ṯurayyā", label: "Gazetteer and Geospatial Model", url: "/research/#althurayya"}
  - {abbr: mARkdown, label: "Annotation Scheme for Arabic Texts", url: "/mARkdown/"}

# Old URLs that must keep working. Each becomes a small HTML page that redirects.
redirects:
  - {from: /about/, to: /}
  - {from: /openarabic/, to: /OpenITI/}
  - {from: /year-archive/, to: /notes/}
  - {from: /categories/, to: /notes/}
  - {from: /tags/, to: /notes/}

# View counting with GoatCounter (goatcounter.com): free for personal sites, open source, no cookies,
# no personal data. Set `goatcounter` to your site code (the part before .goatcounter.com) to switch it on;
# leave it empty to load nothing. `show_views: true` prints the running total in the footer; that needs
# "Allow adding visitor counts on your website" enabled in the GoatCounter settings.
analytics:
  goatcounter: "maximromanov"
  show_views: true

footer_note: "Hand-built static site; no cookies, no trackers. Text is licensed CC BY-NC-SA 4.0 unless noted."
footer_note_counted: "Hand-built static site; no cookies. Visits are counted without personal data by GoatCounter. Text is licensed CC BY-NC-SA 4.0 unless noted."
