# Short project list for the CV; the full descriptions are on the Research page.
projects:
  - years: 2021–2027
    text: "**EIS1600: The Evolution of Islamic Societies (c. 600–1600 CE): Algorithmic Analysis into Social History.** Emmy Noether Junior Research Group, DFG (#445975300), Universität Hamburg. Principal investigator. [Project page](/research/#eis1600) · [eis1600.aai.uni-hamburg.de](https://eis1600.aai.uni-hamburg.de/)"
  - years: 2014–
    text: "**OpenITI: Open Islamicate Texts Initiative** (2014–2016: OpenArabic). Co-PI with Matthew T. Miller (University of Maryland) and Sarah Bowen Savant (Aga Khan University–London). About 8,700 titles by over 3,300 authors, some 861 million words (most conservatively; all texts amount to 2.4 billion words). [Project page](/research/#openiti) · [github.com/OpenITI](https://github.com/OpenITI)"
  - years: 2014–
    text: "**OpenITI mARkdown.** A light-weight annotation scheme for Arabic-script texts: structural, morphological, and semantic tagging designed as a research method rather than an exchange format. [Description](/mARkdown/)"
  - years: 2014–
    text: "**al-Ṯurayyā Project.** A gazetteer (over 2,000 toponyms) and a geospatial model of the early Islamic world, with Masoumeh Seydi. [Project page](/research/#althurayya) · [althurayya.github.io](https://althurayya.github.io/)"
  - years: 2025
    text: "**OpenITI NgramReader** and **M10 Book Classification.** Two online applications published as appendices to *Digital Humanities for Arabic and Islamic Studies* (Brill, 2026). [Project page](/research/#adhfais-apps)"
  - years: 2019–
    text: "**OpenITI AOCP: Arabic-script OCR Catalyst Project.** Co-led with Matthew T. Miller, Sarah Bowen Savant, David Smith, and Raffaele Viglianti; funded by the Andrew W. Mellon Foundation. [openiti.org](https://openiti.org)"
  - years: 2018–2021
    text: "**KITAB: Knowledge, Information Technology, and the Arabic Book.** ERC project (PI Sarah Bowen Savant); senior research fellow responsible for corpus development and text-reuse analysis. [kitab-project.org](https://kitab-project.org/)"
  - years: 2015
    text: "**Classical Arabic Through the Words of the Prophet: A Frequency-Based Ḥadīṯ Reader.** Computationally generated teaching materials (Perseus Project & Department of Classics, Tufts University). [PDF](/files/Romanov_CATWOP.pdf)"

